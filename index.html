<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫ボード">
<meta name="robots" content="noindex,nofollow">
<title>店舗の在庫ボード</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --bg:#eef2f1;
  --surface:#ffffff;
  --surface-2:#f5f8f7;
  --surface-3:#e6edeb;
  --line:#dbe4e2;
  --line-2:#c2cfcc;
  --ink:#101a19;
  --ink-2:#4c5a58;
  --ink-3:#7b8a87;
  --accent:#0f6f6a;
  --accent-ink:#0b5450;
  --accent-soft:#dff0ed;
  --crit:#c1372c;      /* 欠品 */
  --crit-soft:#fbe7e4;
  --warn:#c07208;      /* 発注どき */
  --warn-soft:#fbeed9;
  --over:#4f7391;      /* 多い */
  --over-soft:#e4ecf3;
  --calm:#7b8a87;      /* 適正 */
  --r:12px;
  --r-s:8px;
  --shadow:0 1px 2px rgba(16,26,25,.05), 0 12px 32px -24px rgba(16,26,25,.55);
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Zen Kaku Gothic New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0b1211; --surface:#151d1c; --surface-2:#1a2322; --surface-3:#212c2a;
    --line:#243030; --line-2:#374644;
    --ink:#ecf2f1; --ink-2:#a6b4b1; --ink-3:#7b8a87;
    --accent:#4bb3ab; --accent-ink:#7fd0c9; --accent-soft:#12302e;
    --crit:#e8756a; --crit-soft:#331a18;
    --warn:#e2a03f; --warn-soft:#312512;
    --over:#8fb0cc; --over-soft:#1a2530;
    --calm:#7b8a87;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b1211; --surface:#151d1c; --surface-2:#1a2322; --surface-3:#212c2a;
  --line:#243030; --line-2:#374644;
  --ink:#ecf2f1; --ink-2:#a6b4b1; --ink-3:#7b8a87;
  --accent:#4bb3ab; --accent-ink:#7fd0c9; --accent-soft:#12302e;
  --crit:#e8756a; --crit-soft:#331a18;
  --warn:#e2a03f; --warn-soft:#312512;
  --over:#8fb0cc; --over-soft:#1a2530;
  --calm:#7b8a87;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;line-height:1.35}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;letter-spacing:.02em}
.brand .sub{color:var(--ink-3);font-size:11px;letter-spacing:.14em;font-family:var(--mono);text-transform:uppercase}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-3);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:10px 12px 11px;font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
nav.tabs .count{font-family:var(--mono);font-size:11px;border-radius:999px;padding:1px 6px;margin-left:5px;background:var(--surface-3);color:var(--ink-2)}
nav.tabs .count.alert{background:var(--crit-soft);color:var(--crit)}

/* ---------- pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sec-head h2{font-size:15px}
.sec-head .note{font-size:12.5px;color:var(--ink-3)}
.muted{color:var(--ink-3);font-size:12.5px}
.banner{max-width:1000px;margin:12px auto 0;padding:0 16px}
.banner .in{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 13px;font-size:12.5px;color:var(--accent-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:8px 10px;font-size:14px;width:100%}
textarea{resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.ok{background:var(--surface-3);color:var(--calm)}

/* ---------- summary strip ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip div{background:var(--surface);padding:12px 14px}
.strip .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.strip .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25}
.strip .v small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px;font-family:var(--font)}
.strip .v.crit{color:var(--crit)}
.strip .v.warn{color:var(--warn)}
@media(max-width:640px){.strip{grid-template-columns:repeat(2,1fr)}}

/* ---------- stock list ---------- */
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:3px 1fr auto;gap:0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .stripe{background:transparent}
.it.s-out .stripe{background:var(--crit)}
.it.s-low .stripe{background:var(--warn)}
.it.s-over .stripe{background:var(--over)}
.it .main{padding:11px 12px;min-width:0}
.it .nm{font-weight:700;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.it .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.it .meta .dot{color:var(--line-2)}
.it .side{padding:11px 12px 11px 4px;display:flex;align-items:center;gap:10px}
.it .qty{text-align:right;min-width:74px}
.it .qty b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;line-height:1.15;display:block}
.it .qty span{font-size:11px;color:var(--ink-3)}
.it .acts{display:flex;gap:5px}
.it .iq{border:1px solid var(--line-2);background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;line-height:1;display:grid;place-items:center;color:var(--ink-2)}
.it .iq:hover{background:var(--surface-3);color:var(--ink)}
@media(max-width:520px){
  .it{grid-template-columns:3px 1fr}
  .it .side{grid-column:2;padding:0 12px 11px;justify-content:space-between}
}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:180px}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-2)}

/* ---------- 棚卸 ---------- */
.ct{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.ct:last-child{border-bottom:0}
.ct .th{font-size:11.5px;color:var(--ink-3);text-align:right}
.ct input{text-align:right;font-family:var(--mono);font-size:16px;padding:7px 9px}
.ct .theo{text-align:right;font-family:var(--mono);color:var(--ink-2)}
.ct .diff{font-family:var(--mono);font-size:11.5px;text-align:right}
.ct .diff.minus{color:var(--crit)}
.ct .diff.plus{color:var(--over)}
.ctw{border-bottom:1px solid var(--line)}
.ctw:last-child{border-bottom:0}
.ctw .ct{border-bottom:0}
.why{display:none;padding:0 12px 11px;gap:6px;align-items:center;flex-wrap:wrap}
.why.on{display:flex}
.why .lb{font-size:11.5px;color:var(--warn);font-weight:600;white-space:nowrap}
.why select{width:auto;min-width:132px;font-size:13px;padding:6px 8px}
.why input{flex:1;min-width:150px;font-size:13px;padding:6px 9px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,18,17,.45);display:grid;place-items:end center;padding:0}
@media(min-width:620px){.modal{place-items:center;padding:20px}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
@media(min-width:620px){.sheet{border-radius:var(--r)}}
.sheet .hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:1}
.sheet .hd h3{font-size:15px}
.sheet .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.kinds button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:9px;font-size:13.5px;cursor:pointer;font-weight:500}
.kinds button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{border:1px solid var(--line-2);background:var(--surface-2);width:42px;height:42px;border-radius:var(--r-s);font-size:19px;cursor:pointer;line-height:1}
.stepper input{text-align:center;font-family:var(--mono);font-size:20px;font-weight:600;padding:9px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.help{font-size:13px;color:var(--ink-2);line-height:1.85}
.help b{color:var(--ink)}
.help ol{margin:6px 0 0;padding-left:1.3em}
.help li{margin-bottom:4px}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>店舗の在庫ボード</h1>
      <span class="sub">stock</span>
      <span class="spacer"></span>
      <div class="seg" id="storeSeg" role="group" aria-label="店舗の切り替え"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<div class="banner" id="banner"></div>
<main class="wrap" id="view"></main>
<div id="toast" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   店舗の在庫ボード
   保存先: Supabase（store-ops-board の stock_docs テーブル）。合言葉は x-stock-key ヘッダで送る。
   在庫数 = 最新の棚卸の数 ＋ それ以降の入出庫の合計
   ============================================================ */

/* ---------- 小道具 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(num(n) * 100) / 100).toLocaleString("ja-JP");
const yen = n => "¥" + Math.round(num(n)).toLocaleString("ja-JP");
const nowISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const dayLabel = iso => { const d = new Date(iso); return isNaN(d) ? "-" : (d.getMonth() + 1) + "/" + d.getDate(); };
const stampLabel = iso => {
  const d = new Date(iso); if (isNaN(d)) return "-";
  const p = n => String(n).padStart(2, "0");
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
};

/* localStorage はブラウザの設定で使えないことがあるので、必ず包んで使う */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない環境 */ } }
};

function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  $("#toast").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- 状態 ---------- */
const KINDS = {
  in:     { label: "入荷",       sign: +1, verb: "入荷を記録" },
  out:    { label: "使用・出庫", sign: -1, verb: "使用を記録" },
  waste:  { label: "廃棄・破損", sign: -1, verb: "廃棄を記録" },
  back:   { label: "戻し・返品", sign: +1, verb: "戻しを記録" }
};
/* chain: true の店舗は、POS の全店集計を読むだけの欄。入出庫も棚卸もしない */
const DEFAULT_STORES = [
  { id: "funabashi", name: "船橋" },
  { id: "yachiyo", name: "八千代" },
  { id: "chain", name: "全店", chain: true }
];
/* 保存されている店舗一覧を整える。全店の欄が無ければ足す */
function normalizeStores(list) {
  const out = (list && list.length ? list : DEFAULT_STORES).map(s => ({
    id: s.id, name: s.name, hidden: !!s.hidden, chain: s.id === "chain"
  }));
  if (!out.some(s => s.id === "chain")) out.push({ id: "chain", name: "全店", hidden: false, chain: true });
  return out;
}
const visibleStores = () => {
  const v = S.settings.stores.filter(s => !s.hidden);
  return v.length ? v : S.settings.stores;
};
const isChain = () => S.store === "chain";
const realStores = () => S.settings.stores.filter(s => !s.chain);
const DEFAULT_CATS = ["物販", "消耗品・備品", "レンタル品"];

const S = {
  ready: false, sample: false, cloud: false,
  items: [], moves: [], counts: [],
  settings: { stores: DEFAULT_STORES, categories: DEFAULT_CATS },
  chain: [], chainAt: "", posref: {}, posrefList: [], posrefLoose: {},
  store: LS.get("sb.store") || "funabashi",
  tab: "stock",
  q: "", cat: "", filter: "active", countAll: false, countSort: LS.get("sb.countSort") || "cat",
  who: LS.get("sb.who") || "",
  stock: {}, lastCount: {}
};


/* ---------- サンプル（本物のデータが1件も無いときだけ表示） ---------- */
const SAMPLE = [
  ["液体チョーク 250ml", "funabashi", "物販", "本", 4, 12, 780, 1400, "ROCK商事", 6],
  ["チョークボール 詰め替え用", "funabashi", "物販", "個", 5, 15, 620, 1100, "ROCK商事", 3],
  ["フィンガーテープ 13mm", "funabashi", "物販", "巻", 10, 30, 180, 350, "ROCK商事", 22],
  ["スポーツドリンク 500ml", "funabashi", "物販", "本", 12, 48, 88, 180, "アズマ商会", 0],
  ["店舗ロゴTシャツ M", "funabashi", "物販", "枚", 3, 8, 1200, 2800, "本部発注", 9],
  ["ペーパータオル 200枚", "funabashi", "消耗品・備品", "束", 6, 20, 210, 0, "アズマ商会", 4],
  ["アルコール詰替 1L", "funabashi", "消耗品・備品", "本", 2, 6, 640, 0, "アズマ商会", 2],
  ["ゴミ袋 45L 100枚", "funabashi", "消耗品・備品", "箱", 2, 5, 980, 0, "アズマ商会", 3],
  ["レジロール 58mm", "funabashi", "消耗品・備品", "巻", 5, 15, 45, 0, "本部発注", 8],
  ["ホールド洗浄ブラシ", "funabashi", "消耗品・備品", "本", 3, 8, 520, 0, "ROCK商事", 5],
  ["レンタルシューズ 25.0cm", "funabashi", "レンタル品", "足", 4, 6, 4800, 0, "本部発注", 4],
  ["レンタルシューズ 27.0cm", "funabashi", "レンタル品", "足", 3, 5, 4800, 0, "本部発注", 2],
  ["レンタルチョークバッグ", "funabashi", "レンタル品", "個", 6, 15, 1500, 0, "本部発注", 11],
  ["液体チョーク 250ml", "yachiyo", "物販", "本", 4, 12, 780, 1400, "ROCK商事", 2],
  ["スポーツドリンク 500ml", "yachiyo", "物販", "本", 12, 48, 88, 180, "アズマ商会", 30],
  ["ペーパータオル 200枚", "yachiyo", "消耗品・備品", "束", 6, 20, 210, 0, "アズマ商会", 11],
  ["レンタルシューズ 24.0cm", "yachiyo", "レンタル品", "足", 4, 6, 4800, 0, "本部発注", 3]
].map((r, i) => ({
  id: "sample" + i, name: r[0], store: r[1], category: r[2], unit: r[3],
  minQty: r[4], parQty: r[5], cost: r[6], price: r[7], supplier: r[8], _qty: r[9],
  note: "", archived: false, createdAt: nowISO()
}));
const SAMPLE_MOVES = [

function sbHeaders(extra) {

async function sbSelect(collection) {

async function sbUpsert(collection, id, data) {

async function put(col, doc) {
  const rec = Object.assign({}, doc);

  if (i < 0) arr.push(full); else arr[i] = full;

}

/* ---------- 集計 ---------- */
function baseItems() { return S.items.filter(i => !i.archived); }
function activeItems() { return S.sample ? SAMPLE : baseItems(); }
function activeMoves() { return S.sample ? SAMPLE_MOVES : S.moves; }

function recompute() {
  S.sample = S.ready && S.items.length === 0;
  S.lastCount = {}; S.stock = {}; S.touched = {};
  for (const c of S.counts) S.touched[c.itemId] = true;
  for (const m of S.moves) S.touched[m.itemId] = true;
  for (const c of S.counts) {
    const p = S.lastCount[c.itemId];
    if (!p || String(c.at) > String(p.at)) S.lastCount[c.itemId] = c;
  }
  for (const it of activeItems()) {
    if (S.sample) { S.stock[it.id] = it._qty; continue; }
    const c = S.lastCount[it.id];
    let q = c ? num(c.qty) : 0;
    const since = c ? String(c.at) : "";
    for (const m of S.moves) {
      if (m.itemId !== it.id) continue;
      if (since && String(m.at) <= since) continue;
      const k = KINDS[m.kind]; if (!k) continue;
      q += k.sign * num(m.qty);
    }
    S.stock[it.id] = q;
  }
}
const stockOf = it => num(S.stock[it.id]);
/* 在庫金額の単価。仕入値が入っていればそれ、無ければ売価を使う */
const unitValue = it => num(it.cost) || num(it.price);
function valueBasis() {
  const list = activeItems();
  const hasCost = list.some(i => num(i.cost) > 0);
  const hasPrice = list.some(i => !num(i.cost) && num(i.price) > 0);
  return hasCost && hasPrice ? "仕入値・売価" : hasCost ? "仕入値" : "売価";
}
/* 棚卸も入出庫も一度も記録していない商品（POSに登録だけある商品）は「未使用」。
   在庫0でも欠品としては扱わず、発注リストにも出さない。発注点を入れれば見張り始める */
const tracked = it => S.sample || !!S.touched[it.id];
function statusOf(it) {
  const q = stockOf(it), min = num(it.minQty), par = num(it.parQty);
  if (q <= 0 && min <= 0 && !tracked(it)) return "idle";
  if (q <= 0) return "out";
  if (min > 0 && q <= min) return "low";
  if (par > 0 && q > par * 1.6) return "over";
  return "ok";
}
const STATUS_LABEL = { out: "欠品", low: "発注どき", over: "多い", ok: "適正", idle: "未使用" };
const STATUS_ORDER = { out: 0, low: 1, over: 2, ok: 3, idle: 4 };

function storeItems() {
  return activeItems().filter(i => i.store === S.store)
    .sort((a, b) => (STATUS_ORDER[statusOf(a)] - STATUS_ORDER[statusOf(b)])
      || String(a.category || "").localeCompare(String(b.category || ""), "ja")
      || String(a.name).localeCompare(String(b.name), "ja"));
}
function visibleItems() {
  const q = S.q.trim();
  return storeItems().filter(i => {
    if (S.cat && i.category !== S.cat) return false;
    if (S.filter === "need" && !(statusOf(i) === "out" || statusOf(i) === "low")) return false;
    if (S.filter === "active" && statusOf(i) === "idle") return false;
    if (q && !(String(i.name) + " " + String(i.supplier || "") + " " + String(i.category || "")).includes(q)) return false;
    return true;
  });
}
function categories() {
  if (isChain()) return [...new Set(S.chain.map(r => r[1]).filter(Boolean))];
  const set = new Set(S.settings.categories || []);
  activeItems().forEach(i => { if (i.category) set.add(i.category); });
  return [...set];
}
function suppliers() {
  const set = new Set();
  activeItems().forEach(i => { if (i.supplier) set.add(i.supplier); });
  return [...set].sort((a, b) => a.localeCompare(b, "ja"));
}
const storeName = id => (S.settings.stores.find(s => s.id === id) || { name: id }).name;
const itemById = id => activeItems().find(i => i.id === id) || S.items.find(i => i.id === id);
function orderQty(it) {
  const q = stockOf(it), par = num(it.parQty), min = num(it.minQty);
  const target = par > 0 ? par : (min > 0 ? min * 2 : q + 1);
  return Math.max(1, Math.ceil(target - q));
}
function needList() {
  return storeItems().filter(i => { const s = statusOf(i); return s === "out" || s === "low"; });
}

/* 帳簿とズレたときに選べる理由。〇 のところは差の数で埋める */
const REASONS = [
  ["", "理由を選ぶ…"],
  ["miss", "〇〇と打ち間違い"],
  ["prize", "〇個景品化"],
  ["supply", "〇個備品化"],
  ["roll", "他店舗ローリング"],
  ["unknown", "原因不明"]
];
function reasonText(kind, diff) {
  const n = fmt(Math.abs(diff));
  if (kind === "miss") return "〇〇と打ち間違い";
  if (kind === "prize") return n + "個景品化";
  if (kind === "supply") return n + "個備品化";
  if (kind === "roll") return "他店舗ローリング";
  if (kind === "unknown") return "原因不明";
  return "";
}
/* 棚卸の並び順。棚を回る順に合わせられるように選べる */
const COUNT_SORTS = [
  ["cat", "カテゴリ順"],
  ["name", "商品名順"],
  ["pos", "POSの棚卸リストと同じ順"],
  ["qty", "在庫の多い順"],
  ["supplier", "仕入先順"]
];
function sortForCount(list) {
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), "ja");
  if (S.countSort === "name") return list.sort(byName);
  if (S.countSort === "qty") return list.sort((a, b) => stockOf(b) - stockOf(a) || byName(a, b));
  if (S.countSort === "supplier") {
    return list.sort((a, b) => String(a.supplier || "￿").localeCompare(String(b.supplier || "￿"), "ja") || byName(a, b));
  }
  if (S.countSort === "pos") {
    if (!S.posrefList.length) return list.sort(byName);
    const at = {};
    S.posrefList.forEach((r, n) => { at[normName(r[0])] = n; at[looseKey(r[0])] = n; });
    const pos = it => {
      const k = at[normName(it.name)];
      return k != null ? k : (at[looseKey(it.name)] != null ? at[looseKey(it.name)] : 1e9);
    };
    return list.sort((a, b) => pos(a) - pos(b) || byName(a, b));
  }
  return list.sort((a, b) =>
    String(a.category || "￿").localeCompare(String(b.category || "￿"), "ja") || byName(a, b));
}

function viewOrder() {
  const need = needList();
  const groups = {};
  need.forEach(i => { const k = i.supplier || "仕入先なし"; (groups[k] = groups[k] || []).push(i); });
  const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "ja"));
  const total = need.reduce((a, i) => a + orderQty(i) * unitValue(i), 0);

  if (!need.length) {
    return '<div class="card"><h2 style="font-size:15px">発注リスト</h2>' +
      '<div class="empty">いま発注が必要な商品はありません。<br><span class="muted">在庫が発注点を下回ると、ここに並びます。</span></div></div>';
  }

  const blocks = keys.map(k => {
    const rows = groups[k].map(i =>
      "<tr><td class=\"w\">" + esc(i.name) + (statusOf(i) === "out" ? ' <span class="pill crit">欠品</span>' : "") + "</td>" +
      '<td class="n">' + esc(fmt(stockOf(i))) + "</td>" +
      '<td class="n">' + esc(fmt(i.minQty)) + "</td>" +
      '<td class="n"><b>' + esc(fmt(orderQty(i))) + "</b> " + esc(i.unit || "個") + "</td>" +
      '<td class="n">' + esc(unitValue(i) ? yen(orderQty(i) * unitValue(i)) : "-") + "</td>" +
      '<td><button class="btn sm" data-act="quick" data-id="' + esc(i.id) + '" data-kind="in">入荷を記録</button></td></tr>'
    ).join("");
    const sub = groups[k].reduce((a, i) => a + orderQty(i) * unitValue(i), 0);
    return '<div class="sec-head"><h2>' + esc(k) + '</h2><span class="note">' + groups[k].length + " 件 / " + esc(yen(sub)) + "</span></div>" +
      '<div class="tw"><table><thead><tr><th>商品</th><th class="n">在庫</th><th class="n">発注点</th><th class="n">発注数の目安</th><th class="n">金額</th><th></th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
  }).join("");

  return '<div class="card"><div class="row"><div><h2 style="font-size:15px">発注リスト</h2>' +
    '<p class="muted">在庫が発注点以下の商品です。目安の数は「適正在庫 − いまの在庫」。</p></div>' +
    '<span class="spacer"></span>' +
    '<button class="btn" data-act="copyOrder">文字でコピー</button>' +
    '<button class="btn primary" data-act="csvOrder">CSVで書き出す</button></div>' +
    '<div class="strip" style="margin-top:14px"><div><div class="k">発注が要る品目</div><div class="v crit">' + need.length + '<small>件</small></div></div>' +
    '<div><div class="k">うち欠品</div><div class="v">' + need.filter(i => statusOf(i) === "out").length + '<small>件</small></div></div>' +
    '<div><div class="k">仕入先</div><div class="v">' + keys.length + '<small>先</small></div></div>' +
    '<div><div class="k">概算の仕入額</div><div class="v">' + esc(yen(total)) + "</div></div></div></div>" + blocks;
}

function orderText() {
  const need = needList();
  const lines = [storeName(S.store) + " 発注リスト（" + new Date().toLocaleDateString("ja-JP") + "）"];
  const groups = {};
  need.forEach(i => { const k = i.supplier || "仕入先なし"; (groups[k] = groups[k] || []).push(i); });
  Object.keys(groups).sort((a, b) => a.localeCompare(b, "ja")).forEach(k => {
    lines.push("", "【" + k + "】");
    groups[k].forEach(i => lines.push("・" + i.name + "  " + orderQty(i) + (i.unit || "個") + "（在庫 " + fmt(stockOf(i)) + "）"));
  });
  return lines.join("\n");
}

/* ブラウザの confirm() はこのページの枠の中では出せないので、自前で出す */
function askConfirm(msg, okLabel, danger) {
  return new Promise(resolve => {
    const el = document.createElement("div");

/* ---------- POSの棚卸フォーマットで書き出す ---------- */

/* Shift-JIS の変換表。TextDecoder で読める組み合わせを総当たりして逆引きを作る（使うときだけ） */
let SJIS = null;
function sjisMap() {
  if (SJIS) return SJIS;
  const map = new Map(), dec = new TextDecoder("shift_jis"), pair = new Uint8Array(2);
  for (let b = 0; b < 0x80; b++) map.set(String.fromCharCode(b), [b]);
  for (let b = 0xA1; b <= 0xDF; b++) {
    const ch = dec.decode(new Uint8Array([b]));
    if (ch.length === 1 && ch !== String.fromCharCode(0xFFFD)) map.set(ch, [b]);
  }
  for (let hi = 0x81; hi <= 0xFC; hi++) {
    for (let lo = 0x40; lo <= 0xFC; lo++) {
      if (lo === 0x7F) continue;
      pair[0] = hi; pair[1] = lo;
      const ch = dec.decode(pair);
      if (ch.length === 1 && ch !== String.fromCharCode(0xFFFD) && !map.has(ch)) map.set(ch, [hi, lo]);
    }
  }
  SJIS = map;
  return map;
}
function toSjis(text) {
  const map = sjisMap(), out = [];
  for (const ch of text) {
    const b = map.get(ch);
    if (b) for (const x of b) out.push(x); else out.push(0x3F);
  }
  return new Uint8Array(out);
}
/* 記号を落としたゆるい名前。POSの商品在庫表は「ー」などを "?" に化けさせて書き出すので、
   そこだけ違う同じ商品を結びつけるために使う */
const looseKey = s => normName(s).toLowerCase()
  .replace(/[?‐-―ー－−・･_,.\-]/g, "")
  .replace(/\s+/g, "");
/* キーが重なったものは、取り違えると危ないので捨てる */
function uniqueBy(list, keyOf) {
  const m = {}, bad = {};
  for (const x of list) {
    const k = keyOf(x);
    if (!k || bad[k]) continue;
    if (m[k] && m[k] !== x) { bad[k] = 1; delete m[k]; continue; }
    m[k] = x;
  }
  return m;
}
/* 半角英数を全角に。POS は商品名を全角で持っている */
function toWide(s) {
  return String(s == null ? "" : s)
    .replace(/[\x21-\x7E]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0))
    .replace(/ /g, "　");
}
const posName = it => { const r = posrefOf(it); return r ? r[0] : toWide(it.name); };
const posGroup = it => { const r = posrefOf(it); return r ? r[1] : (it.category || ""); };
const posrefOf = it => S.posref[normName(it.name)] || S.posrefLoose[looseKey(it.name)] || null;

/* 棚卸を1回ぶんにまとめる（同じ時刻で保存したものが1回） */
function countSessions() {
  const by = {};
  S.counts.filter(c => c.store === S.store && c.memo === "棚卸").forEach(c => {
    (by[c.at] = by[c.at] || []).push(c);
  });
  return Object.keys(by).sort((a, b) => b.localeCompare(a))
    .map(at => ({ at: at, rows: by[at], by: by[at][0].by || "" }));
}
function posDate(d) {
  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
}
/* POS の棚卸リストは商品マスタ全部を並べる。POSの並び順のまま出し、
   この店舗にしか無い商品を最後に足す */
function posStocktakeRows() {
  const items = storeItems();
  const mine = {}, used = {}, out = [];
  items.forEach(it => { mine[normName(it.name)] = it; });
  const mineLoose = uniqueBy(items, it => looseKey(it.name));
  for (const r of (S.posrefList || [])) {
    let it = mine[normName(r[0])];
    if (!it) {
      const cand = mineLoose[looseKey(r[0])];
      if (cand && !used[normName(cand.name)]) it = cand;
    }
    if (it) used[normName(it.name)] = true;
    out.push({ name: r[0], group: r[1] || (it ? it.category : "") || "", item: it || null });
  }
  /* POSの一覧に無い商品（一覧を作ったあとに増えたもの）だけ最後に足す */
  items.forEach(it => {
    if (!used[normName(it.name)]) out.push({ name: toWide(it.name), group: it.category || "", item: it });
  });
  return out;
}
function posStocktakeCSV(session, head) {
  const W = "　";
  const title = "棚卸リスト" + W + W + "店舗名:" + head.store + W + W + "作成日:" + head.made +
    W + "完了日:" + head.done + W + "作業者:" + head.by + W + "承認日:" + head.approved + W + "承認者:" + head.approver;
  const counted = {};
  if (session) session.rows.forEach(c => { counted[c.itemId] = c; });
  const q = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const lines = [q(title),
    [q("商品コード"), q("商品名"), q("商品グループ"), q("システム在庫数"), q("システム在庫金額"),
     q("システム在庫原価"), q("在庫数"), q("在庫金額"), q("在庫原価"), q("備考")].join(",")];
  posStocktakeRows().forEach(r => {
    const it = r.item;
    const c = it ? counted[it.id] : null;
    const sys = it ? (c && c.systemQty != null ? num(c.systemQty) : stockOf(it)) : 0;
    const got = it ? (c ? num(c.qty) : sys) : 0;
    const u = it ? unitValue(it) : 0;
    lines.push([q(""), q(r.name), q(r.group), q(sys), q(Math.round(sys * u)), q(0),
      q(got), q(Math.round(got * u)), q(0), (c && c.note ? q(c.note) : "")].join(","));
  });
  return lines.join("\r\n") + "\r\n";
}

/* ---------- POSの在庫表の取り込み ---------- */
let IMPORT = null;

/* Shift-JIS で書き出されることが多いので、UTF-8 で化けたら読み直す */
function decodeCsv(buf) {
  const utf8 = new TextDecoder("utf-8").decode(buf);
  if (utf8.indexOf(String.fromCharCode(0xFFFD)) < 0) return utf8;
  try { return new TextDecoder("shift_jis").decode(buf); } catch (e) { return utf8; }
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
/* 全角英数を半角に。POS は商品名を全角で書き出す */
function normName(s) {
  return String(s == null ? "" : s)
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ").replace(/\s+/g, " ").trim()
    .replace(/\?chalkup\?/g, "chalkup").replace(/TN\?Pro/g, "TN-Pro");
}
const COL_ALIAS = {
  name: ["商品名", "品名", "商品"],
  qty: ["在庫数(理論)", "在庫数（理論）", "在庫数", "現在庫", "在庫"],
  value: ["在庫金額"],
  supplier: ["仕入先", "取引先"]
};
function findCols(rows) {
  for (let r = 0; r < Math.min(rows.length, 5); r++) {
    const cells = rows[r].map(c => String(c).trim());
    const idx = {};
    for (const key of Object.keys(COL_ALIAS)) {
      const at = cells.findIndex(c => COL_ALIAS[key].indexOf(c) >= 0);
      if (at >= 0) idx[key] = at;
    }
    if (idx.name != null && idx.qty != null) return { header: r, idx: idx };
  }
  return null;
}
/* 新しい商品のカテゴリは、同じ仕入先の商品から借りる */
function guessCategory(supplier) {
  if (!supplier) return "";
  const m = storeItems().find(i => i.supplier === supplier && i.category);
  return m ? m.category : "";
}
function buildPlan(text) {
  const rows = parseCSV(text);
  const found = findCols(rows);
  if (!found) return { error: "「商品名」と「在庫数」の列が見つかりませんでした。POSの商品在庫表のCSVか確認してください。" };
  const ix = found.idx;
  const byName = {};
  storeItems().forEach(i => { byName[normName(i.name)] = i; });
  const byLoose = uniqueBy(storeItems(), i => looseKey(i.name));
  const update = [], create = [], seen = {};
  let same = 0;
  for (let r = found.header + 1; r < rows.length; r++) {
    const cells = rows[r];
    const name = normName(cells[ix.name]);
    if (!name) continue;
    const qty = num(String(cells[ix.qty]).replace(/,/g, ""));
    const value = ix.value != null ? num(String(cells[ix.value]).replace(/,/g, "")) : 0;
    const price = qty !== 0 && value !== 0 ? Math.round(Math.abs(value / qty)) : 0;
    const supplier = ix.supplier != null ? normName(cells[ix.supplier]) : "";
    /* 記号の化けだけが違う同じ商品を、二重登録しないように拾う */
    const it = byName[name] || byLoose[looseKey(name)];
    seen[name] = true;
    if (it) seen[normName(it.name)] = true;
    if (it) { if (stockOf(it) !== qty) update.push({ item: it, to: qty, price: price }); else same++; }
    else create.push({ name: name, qty: qty, price: price, supplier: supplier });
  }
  const missing = storeItems().filter(i => !seen[normName(i.name)]);
  const total = update.length + create.length + same;
  return {
    update: update, create: create, same: same, missing: missing,
    tooMany: total > 1000
  };
}
function planHTML(p) {
  if (p.error) return '<p class="muted" style="color:var(--crit)">' + esc(p.error) + "</p>";
  const warn = p.tooMany
    ? '<p class="muted" style="color:var(--warn)">商品が ' + fmt(p.update.length + p.create.length + p.same) +
      " 件あります。全店の在庫表ではありませんか？ 全店の合計を店舗の在庫として取り込むと、数字が合わなくなります。</p>"
    : "";
  const rows = p.update.slice(0, 12).map(u =>
    "<tr><td class=\"w\">" + esc(u.item.name) + '</td><td class="n">' + esc(fmt(stockOf(u.item))) +
    '</td><td class="n">→</td><td class="n"><b>' + esc(fmt(u.to)) + "</b></td></tr>").join("");
  return warn +
    '<div class="strip">' +
    '<div><div class="k">在庫が変わる</div><div class="v">' + p.update.length + '<small>件</small></div></div>' +
    '<div><div class="k">変わらない</div><div class="v">' + p.same + '<small>件</small></div></div>' +
    '<div><div class="k">新しく登録</div><div class="v">' + p.create.length + '<small>件</small></div></div>' +
    '<div><div class="k">CSVに無い</div><div class="v">' + p.missing.length + '<small>件</small></div></div>' +
    "</div>" +
    '<p class="muted">「CSVに無い」商品はそのままにします（消しません）。</p>' +
    (p.update.length ? '<div class="tw"><table><thead><tr><th>商品</th><th class="n">いま</th><th></th><th class="n">取り込み後</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      (p.update.length > 12 ? '<p class="muted">ほか ' + (p.update.length - 12) + " 件</p>" : "") : "") +
    (p.create.length ? '<p class="muted">新しく登録: ' + p.create.slice(0, 8).map(c => esc(c.name)).join(" / ") +
      (p.create.length > 8 ? " ほか " + (p.create.length - 8) + " 件" : "") + "</p>" : "");
}
function importModal() {
  if (isChain()) { toast("全店では取り込めません。船橋か八千代に切り替えてください"); return; }
  IMPORT = null;
  const body =
    '<p class="muted">POS の「商品在庫表」CSV を読み込んで、<b>' + esc(storeName(S.store)) + '</b> のいまの在庫数を一括で書き換えます。' +
    "商品名で照らし合わせ、CSVに無い商品はそのまま残します。</p>" +
    '<label class="f">CSVファイル<input type="file" id="impFile" accept=".csv,text/csv"></label>' +
    '<label class="f">または、中身を貼り付ける<textarea id="impPaste" rows="4" placeholder="エクセルやメモ帳から貼り付け"></textarea></label>' +
    '<div id="impPreview"></div>';
  const el = openModal("POSの在庫表を取り込む", body,
    '<button class="btn" data-act="closeModal">やめる</button>' +
    '<button class="btn primary" data-act="doImport" id="impGo" disabled>この内容で取り込む</button>');

  const show = (text) => {

  };
  $("#impFile", el).addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    $("#impPreview", el).innerHTML = '<p class="muted">読み込んでいます…</p>';
    show(decodeCsv(await f.arrayBuffer()));
  });
  $("#impPaste", el).addEventListener("change", e => { if (e.target.value.trim()) show(e.target.value); });
}
async function runImport() {
  const p = IMPORT;
  if (!p || p.error) return;
  const go = $("#impGo", modalEl);
  const at = nowISO();
  const label = n => { if (go) go.textContent = "取り込み中… " + n + "/" + (p.update.length + p.create.length); };
  if (go) go.disabled = true;
  let n = 0;
  try {
    for (const u of p.update) {
      const c = S.lastCount[u.item.id];
      await put("counts", { id: c ? c.id : undefined, itemId: u.item.id, store: u.item.store, qty: u.to, at: at, memo: "POSの在庫表から取り込み", by: S.who });
      if (!num(u.item.price) && u.price) await put("items", Object.assign({}, u.item, { price: u.price }));
      label(++n);
    }
    for (const c of p.create) {
      const id = await put("items", {
        name: c.name, store: S.store, category: guessCategory(c.supplier), unit: "個",
        minQty: 0, parQty: 0, cost: 0, price: c.price, supplier: c.supplier,
        note: "", archived: false, createdAt: at
      });
      if (c.qty !== 0) await put("counts", { itemId: id, store: S.store, qty: c.qty, at: at, memo: "POSの在庫表から取り込み", by: S.who });
      label(++n);
    }
  } catch (e) {
    closeModal(); toast("途中で失敗しました: " + (e && e.code ? e.code : "エラー")); apply(); return;
  }
  closeModal();
  toast("取り込みました（在庫 " + p.update.length + "件・新規 " + p.create.length + "件）");
  apply();
}

function chainCSV() {
  const rows = [["商品名", "カテゴリ", "在庫", "単位", "単価(売価)", "在庫金額", "ブランド", "販売数"]];
  chainRows().forEach(r => rows.push([r[0], r[1], r[3], r[2], r[4] || "", Math.max(num(r[3]), 0) * num(r[4]), r[5] || "", r[6]]));
  return "﻿" + rows.map(csvLine).join("\r\n");
}
function downloadFile(data, filename, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}
async function saveCSV(text, filename) { downloadFile(text, filename); toast("書き出しました"); }
